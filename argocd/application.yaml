apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todoapp-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io  # cleanup on delete
spec:
  project: default

  source:
    repoURL: https://github.com/kotttyaravind/todoapp-gitops
    targetRevision: HEAD
    path: apps/todoapp/overlays/dev   # Point to dev overlay

  destination:
    server: https://kubernetes.default.svc   # In-cluster
    namespace: todoapp

  syncPolicy:
    automated:
      prune: true       # Delete resources removed from Git
      selfHeal: true    # Revert manual kubectl changes
    syncOptions:
      - CreateNamespace=true   # Auto-create namespace
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
